name: Mantener la demo despierta

# Supabase (plan gratuito) pausa el proyecto tras una semana sin actividad.
# Cada tres días se pide /api/healthz, que hace un SELECT 1 contra la base:
# eso cuenta como actividad y, si la base no responde, el job falla y avisa.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 10 https://reservas-bradlopez13.vercel.app/api/healthz
