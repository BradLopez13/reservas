packages:
  - packages/*
  - apps/*
  - e2e

# pnpm 12 no ejecuta scripts de instalacion sin aprobarlos. esbuild (tsx, vitest)
# y protobufjs (testcontainers) los necesitan; cpu-features y ssh2 son nativos
# opcionales de testcontainers y funcionan sin compilar; msw solo imprime un aviso.
allowBuilds:
  esbuild: true
  protobufjs: true
  cpu-features: false
  ssh2: false
  msw: false

# pnpm 12 espera 24 h antes de instalar versiones recien publicadas; motion 13.4.3
# lo era el dia que se creo el proyecto.
minimumReleaseAgeExclude:
  - framer-motion@13.4.3
  - motion@13.4.3
