server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API vive en el mismo origen: la cookie de sesión viaja sola y no hace falta CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Las rutas de React (/pistas/…, /mis-reservas) las resuelve el router del cliente.
  location / { try_files $uri $uri/ /index.html; }

  # Los ficheros con hash en el nombre no cambian nunca.
  location ~* \.(js|css|ico|png|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
